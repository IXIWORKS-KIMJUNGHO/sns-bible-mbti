name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/sns-bible-mbti/"

      - name: Optimize web build (remove unused assets)
        run: |
          # 웹에서 사용하지 않는 비디오 파일 제거
          rm -rf build/web/assets/assets/videos/bible_people/*.mp4 || true
          rm -rf build/web/assets/assets/videos/loading.mp4 || true
          rm -rf build/web/assets/assets/videos/intro_video.mp4 || true
          echo "Optimized build size:"
          du -sh build/web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

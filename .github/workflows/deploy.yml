name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Optimize web build (remove unused assets)
        run: |
          # 웹에서 사용하지 않는 비디오 파일 제거
          rm -rf build/web/assets/assets/videos/bible_people/*.mp4 || true
          rm -rf build/web/assets/assets/videos/loading.mp4 || true
          rm -rf build/web/assets/assets/videos/intro_video.mp4 || true

          # 성경 카드 이미지 제거 (서버에서 생성하므로 웹 빌드에 불필요)
          rm -rf build/web/assets/assets/images/bible_cards/*.png || true

          # 로컬 폰트 파일 제거 (Google Fonts 사용)
          rm -rf build/web/assets/assets/fonts/*.otf || true

          echo "Optimized build size:"
          du -sh build/web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNS_REJOICE_ALLIIN_PROJECT }}
          channelId: live
          projectId: sns-rejoice-alliin-project
